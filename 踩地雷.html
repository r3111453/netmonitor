<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<title>踩地雷 Minesweeper</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 20px;
    font-family: "Microsoft JhengHei", "PingFang TC", sans-serif;
    background: #2b2b2b;
    color: #eee;
    user-select: none;
  }
  .container {
    max-width: 620px;
    margin: 0 auto;
  }
  h1 {
    font-size: 20px;
    margin: 0 0 12px 0;
    color: #4fc3f7;
  }
  .row {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    align-items: center;
    margin-bottom: 8px;
  }
  .row label { font-size: 14px; }
  input[type="text"] {
    padding: 4px 8px;
    font-size: 14px;
    border: 1px solid #555;
    background: #1e1e1e;
    color: #eee;
    border-radius: 3px;
    width: 150px;
  }
  button {
    padding: 5px 12px;
    font-size: 13px;
    border: 1px solid #555;
    background: #3a3a3a;
    color: #eee;
    border-radius: 3px;
    cursor: pointer;
    font-family: inherit;
  }
  button:hover { background: #4a4a4a; }
  button:active { background: #2a2a2a; }
  .info {
    display: flex;
    flex-wrap: wrap;
    gap: 16px;
    font-size: 13px;
    margin-bottom: 8px;
    color: #bbb;
  }
  .info .status { color: #4fc3f7; }
  .info .pause { color: #ffb74d; font-weight: bold; }
  .best { color: #81c784; font-size: 12px; }
  #board {
    display: grid;
    gap: 2px;
    background: #1e1e1e;
    padding: 6px;
    border-radius: 4px;
    width: fit-content;
  }
  .cell {
    background: #bdbdbd;
    border: 1px solid #888;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    border-radius: 2px;
    transition: background 0.05s;
  }
  .cell:hover { background: #cfcfcf; }
  .cell.opened {
    background: #e8e8e8;
    border: 1px solid #ccc;
    cursor: default;
  }
  .cell.opened:hover { background: #e8e8e8; }
  .cell.flagged { background: #bdbdbd; color: #d32f2f; }
  .cell.mine { background: #ffcdd2; color: #b71c1c; }
  .cell.boom { background: #ff5252 !important; color: #fff !important; }
  .cell.n1 { color: #1976d2; }
  .cell.n2 { color: #388e3c; }
  .cell.n3 { color: #d32f2f; }
  .cell.n4 { color: #303f9f; }
  .cell.n5 { color: #7b1fa2; }
  .cell.n6 { color: #00838f; }
  .cell.n7 { color: #424242; }
  .cell.n8 { color: #757575; }
  .hint { color: #888; font-size: 12px; margin-top: 6px; }
  .toast {
    position: fixed;
    top: 20px;
    left: 50%;
    transform: translateX(-50%);
    background: #4fc3f7;
    color: #000;
    padding: 10px 20px;
    border-radius: 4px;
    font-size: 14px;
    display: none;
    z-index: 1000;
  }
</style>
</head>
<body>
<div class="container">
  <h1>踩地雷 Minesweeper - 無猜保證</h1>

  <div class="row">
    <label>玩家:</label>
    <input type="text" id="playerName" value="玩家">
    <button onclick="newGame()">新遊戲</button>
    <button onclick="togglePause()" id="pauseBtn">暫停</button>
    <button onclick="replayLevel()">重玩本關</button>
    <button onclick="giveUp()">放棄</button>
  </div>

  <div class="info">
    <span class="status" id="statusTxt">輸入名字後按新遊戲</span>
    <span id="timeTxt">時間：0.0 秒</span>
    <span id="levelTxt">關卡：1</span>
    <span id="mineTxt">剩餘地雷：0</span>
    <span class="pause" id="pauseTxt"></span>
  </div>

  <div class="row">
    <button onclick="showFastest()">最快榜</button>
    <button onclick="showMaxLevels()">最多關榜</button>
    <button onclick="exportBoard()">匯出盤面</button>
    <span class="hint">(Ctrl+E)</span>
    <span class="best" id="bestTxt">最快：- 秒 / 最高：- 關</span>
  </div>

  <div class="row">
    <button onclick="exportSave()">匯出存檔</button>
    <button onclick="triggerImportSave()">匯入存檔</button>
    <input type="file" id="importFile" accept=".json" style="display:none" onchange="importSave(event)">
    <span class="hint">匯出存檔可備份或換裝置繼續玩</span>
  </div>

  <div id="board"></div>

  <div class="hint">
    💡 左鍵翻開、右鍵插旗、Ctrl+E 匯出盤面
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ==================== 全域設定 ====================
const ROWS = 9;
const COLS = 9;
let MINES = 10;
let CELL = 32;

let board = [];
let state = [];
let firstClick = true;
let gameOver = false;
let winFlag = false;
let paused = false;

let startTime = 0;
let elapsedTime = 0;
let currentLevel = 1;

let boomR = -1;
let boomC = -1;

const SCORE_KEY = 'minesweeper_scores';
const SAVE_KEY = 'minesweeper_save';

// ==================== 存檔 / 載入 ====================
function saveGame() {
  if (board.length === 0) return;
  if (!gameOver && !winFlag && startTime > 0 && !paused) {
    elapsedTime = (Date.now() - startTime) / 1000;
  }
  const data = {
    playerName: document.getElementById('playerName').value || '玩家',
    level: currentLevel,
    mines: MINES,
    elapsed: elapsedTime,
    firstClick: firstClick,
    board: board,
    state: state,
    timestamp: Date.now()
  };
  try {
    localStorage.setItem(SAVE_KEY, JSON.stringify(data));
  } catch (e) {}
}

function checkLoadSave() {
  const raw = localStorage.getItem(SAVE_KEY);
  if (!raw) return;
  let data;
  try {
    data = JSON.parse(raw);
  } catch (e) {
    localStorage.removeItem(SAVE_KEY);
    return;
  }
  if (!data || !data.level) return;

  const previewOffline = Math.max(0, Math.floor((Date.now() - (data.timestamp || 0)) / 1000));

  let msg = '偵測到上次未完成的進度：\n\n';
  msg += '玩家：' + data.playerName + '\n';
  msg += '關卡：' + data.level + '\n';
  msg += '地雷數：' + data.mines + '\n';
  msg += '存檔時用時：' + (data.elapsed || 0).toFixed(1) + ' 秒\n';
  if (previewOffline > 0) msg += '離線時間：' + previewOffline + ' 秒（將累加）\n';
  msg += '\n是否載入？';

  if (confirm(msg)) {
    const finalOffline = Math.max(0, Math.floor((Date.now() - (data.timestamp || 0)) / 1000));
    loadSave(data, finalOffline);
  } else {
    localStorage.removeItem(SAVE_KEY);
  }
}

function loadSave(data, offlineSec) {
  document.getElementById('playerName').value = data.playerName || '玩家';
  currentLevel = data.level + 0;
  MINES = data.mines + 0;
  elapsedTime = (data.elapsed || 0) + offlineSec;
  firstClick = !!data.firstClick;

  board = data.board || [];
  state = data.state || [];

  gameOver = false;
  winFlag = false;
  paused = false;
  boomR = -1;
  boomC = -1;

  renderBoard();
  updateInfo();
  updateMineCounter();

  if (!firstClick && !gameOver && !winFlag) {
    startTime = Date.now() - Math.round(elapsedTime * 1000);
    startTimer();
  }

  let offlineMsg = '';
  if (offlineSec > 0) offlineMsg = '\n\n（離線時間 ' + offlineSec + ' 秒已累加）';
  showToast('已載入第 ' + currentLevel + ' 關進度。' + offlineMsg);
}

function deleteSave() {
  localStorage.removeItem(SAVE_KEY);
}

// ==================== 匯出 / 匯入存檔 ====================
function exportSave() {
  const saveRaw = localStorage.getItem(SAVE_KEY);
  const scoreRaw = localStorage.getItem(SCORE_KEY);

  const backup = {
    version: 1,
    exportedAt: new Date().toISOString(),
    save: saveRaw ? JSON.parse(saveRaw) : null,
    scores: scoreRaw ? JSON.parse(scoreRaw) : null
  };

  const json = JSON.stringify(backup, null, 2);
  const blob = new Blob([json], { type: 'application/json;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const now = new Date();
  const stamp = now.getFullYear()
    + String(now.getMonth() + 1).padStart(2, '0')
    + String(now.getDate()).padStart(2, '0')
    + '_'
    + String(now.getHours()).padStart(2, '0')
    + String(now.getMinutes()).padStart(2, '0')
    + String(now.getSeconds()).padStart(2, '0');
  a.href = url;
  a.download = 'minesweeper_save_' + stamp + '.json';
  a.click();
  URL.revokeObjectURL(url);

  showToast('存檔已匯出！');
}

function triggerImportSave() {
  document.getElementById('importFile').value = '';
  document.getElementById('importFile').click();
}

function importSave(event) {
  const file = event.target.files && event.target.files[0];
  if (!file) return;

  const reader = new FileReader();
  reader.onload = function(e) {
    let backup;
    try {
      backup = JSON.parse(e.target.result);
    } catch (err) {
      alert('匯入失敗：檔案格式錯誤（不是有效的 JSON）');
      return;
    }

    if (!backup || backup.version !== 1) {
      alert('匯入失敗：不是本遊戲的存檔格式');
      return;
    }

    let msg = '即將匯入存檔：\n\n';
    if (backup.save) {
      msg += '存檔：第 ' + backup.save.level + ' 關，用時 '
        + (backup.save.elapsed || 0).toFixed(1) + ' 秒\n';
    } else {
      msg += '存檔：（無）\n';
    }
    if (backup.scores) {
      const fc = (backup.scores.fastest || []).length;
      const mc = (backup.scores.maxLevels || []).length;
      msg += '排行榜：最快榜 ' + fc + ' 筆 / 最多關榜 ' + mc + ' 筆\n';
    } else {
      msg += '排行榜：（無）\n';
    }
    msg += '\n匯入後會覆蓋目前的存檔與排行榜。\n\n確定要匯入嗎？';

    if (!confirm(msg)) return;

    try {
      if (backup.save) {
        localStorage.setItem(SAVE_KEY, JSON.stringify(backup.save));
      } else {
        localStorage.removeItem(SAVE_KEY);
      }

      if (backup.scores) {
        localStorage.setItem(SCORE_KEY, JSON.stringify(backup.scores));
      } else {
        localStorage.removeItem(SCORE_KEY);
      }
    } catch (err) {
      alert('匯入失敗：無法寫入 localStorage');
      return;
    }

    updateBestDisplay();
    showToast('匯入成功！正在重新載入...');

    setTimeout(() => {
      location.reload();
    }, 800);
  };

  reader.readAsText(file, 'UTF-8');
}

// ==================== 排行榜 ====================
function getScores() {
  const raw = localStorage.getItem(SCORE_KEY);
  if (!raw) return { fastest: [], maxLevels: [] };
  try {
    const data = JSON.parse(raw);
    return {
      fastest: data.fastest || [],
      maxLevels: data.maxLevels || []
    };
  } catch (e) {
    return { fastest: [], maxLevels: [] };
  }
}

function saveScores(data) {
  try {
    localStorage.setItem(SCORE_KEY, JSON.stringify(data));
  } catch (e) {}
}

function tryAddFastestScore(seconds, playerName) {
  const data = getScores();
  data.fastest.push({ time: seconds, name: playerName });
  data.fastest.sort((a, b) => a.time - b.time);
  data.fastest = data.fastest.slice(0, 10);
  saveScores(data);
}

function tryAddMaxLevel(level, playerName) {
  const data = getScores();
  data.maxLevels.push({ level: level, name: playerName });
  data.maxLevels.sort((a, b) => b.level - a.level);
  data.maxLevels = data.maxLevels.slice(0, 10);
  saveScores(data);
}

function showFastest() {
  const data = getScores();
  let text = '🏆 最快速度榜（前 10 名）\n\n';
  if (data.fastest.length === 0) {
    text += '（尚無記錄）';
  } else {
    data.fastest.forEach((s, i) => {
      text += (i + 1) + '. ' + (s.name || '匿名') + '  —  ' + s.time.toFixed(1) + ' 秒\n';
    });
  }
  alert(text);
}

function showMaxLevels() {
  const data = getScores();
  let text = '🎯 最多關榜（前 10 名）\n\n';
  if (data.maxLevels.length === 0) {
    text += '（尚無記錄）';
  } else {
    data.maxLevels.forEach((s, i) => {
      text += (i + 1) + '. ' + (s.name || '匿名') + '  —  ' + s.level + ' 關\n';
    });
  }
  alert(text);
}

function updateBestDisplay() {
  const data = getScores();
  const bestTime = data.fastest.length > 0 ? data.fastest[0].time.toFixed(1) : '-';
  const bestLevel = data.maxLevels.length > 0 ? data.maxLevels[0].level : '-';
  document.getElementById('bestTxt').textContent =
    '最快：' + bestTime + ' 秒 / 最高：' + bestLevel + ' 關';
}

// ==================== 無猜保證 ====================
function generateBoard(firstR, firstC) {
  const maxTries = 500;
  let tempBoard = [];

  for (let tries = 0; tries < maxTries; tries++) {
    tempBoard = [];
    for (let r = 0; r < ROWS; r++) {
      tempBoard[r] = [];
      for (let c = 0; c < COLS; c++) {
        tempBoard[r][c] = 0;
      }
    }

    let placed = 0;
    while (placed < MINES) {
      const r = Math.floor(Math.random() * ROWS);
      const c = Math.floor(Math.random() * COLS);
      if (Math.abs(r - firstR) <= 1 && Math.abs(c - firstC) <= 1) continue;
      if (tempBoard[r][c] === 0) {
        tempBoard[r][c] = 1;
        placed++;
      }
    }

    if (isSolvable(tempBoard, firstR, firstC)) {
      return tempBoard;
    }
  }
  return tempBoard;
}

function isSolvable(mineBoard, firstR, firstC) {
  const opened = [];
  const flagged = [];
  for (let r = 0; r < ROWS; r++) {
    opened[r] = [];
    flagged[r] = [];
    for (let c = 0; c < COLS; c++) {
      opened[r][c] = 0;
      flagged[r][c] = 0;
    }
  }

  const openQueue = [[firstR, firstC]];
  let changed = true;

  while (changed) {
    changed = false;

    while (openQueue.length > 0) {
      const [r, c] = openQueue.shift();
      if (opened[r][c]) continue;
      opened[r][c] = 1;
      changed = true;

      const n = countMinesIn(mineBoard, r, c);
      if (n === 0) {
        for (let dr = -1; dr <= 1; dr++) {
          for (let dc = -1; dc <= 1; dc++) {
            if (dr === 0 && dc === 0) continue;
            const nr = r + dr, nc = c + dc;
            if (nr >= 0 && nr < ROWS && nc >= 0 && nc < COLS) {
              if (!opened[nr][nc] && !flagged[nr][nc]) {
                openQueue.push([nr, nc]);
              }
            }
          }
        }
      }
    }

    for (let r = 0; r < ROWS; r++) {
      for (let c = 0; c < COLS; c++) {
        if (!opened[r][c]) continue;
        const n = countMinesIn(mineBoard, r, c);
        if (n === 0) continue;

        const hiddenList = [];
        let flagCount = 0;
        for (let dr = -1; dr <= 1; dr++) {
          for (let dc = -1; dc <= 1; dc++) {
            if (dr === 0 && dc === 0) continue;
            const nr = r + dr, nc = c + dc;
            if (nr < 0 || nr >= ROWS || nc < 0 || nc >= COLS) continue;
            if (flagged[nr][nc]) flagCount++;
            else if (!opened[nr][nc]) hiddenList.push([nr, nc]);
          }
        }

        if (flagCount === n) {
          hiddenList.forEach(([rr, cc]) => {
            if (!opened[rr][cc] && !flagged[rr][cc]) {
              openQueue.push([rr, cc]);
              changed = true;
            }
          });
        }
        if (hiddenList.length + flagCount === n) {
          hiddenList.forEach(([rr, cc]) => {
            if (!flagged[rr][cc]) {
              flagged[rr][cc] = 1;
              changed = true;
            }
          });
        }
      }
    }
  }

  const totalSafe = ROWS * COLS - MINES;
  let openedCount = 0;
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      if (opened[r][c]) openedCount++;
      if (opened[r][c] && mineBoard[r][c] === 1) return false;
    }
  }

  return openedCount === totalSafe;
}

function countMinesIn(mineBoard, r, c) {
  let cnt = 0;
  for (let dr = -1; dr <= 1; dr++) {
    for (let dc = -1; dc <= 1; dc++) {
      if (dr === 0 && dc === 0) continue;
      const nr = r + dr, nc = c + dc;
      if (nr >= 0 && nr < ROWS && nc >= 0 && nc < COLS) {
        if (mineBoard[nr][nc] === 1) cnt++;
      }
    }
  }
  return cnt;
}

// ==================== 渲染 ====================
function renderBoard() {
  const boardEl = document.getElementById('board');
  boardEl.style.gridTemplateColumns = `repeat(${COLS}, ${CELL}px)`;
  boardEl.style.gridTemplateRows = `repeat(${ROWS}, ${CELL}px)`;
  boardEl.innerHTML = '';

  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      const cell = document.createElement('div');
      cell.className = 'cell';
      cell.dataset.r = r;
      cell.dataset.c = c;
      cell.addEventListener('click', () => handleLeftClick(r, c));
      cell.addEventListener('contextmenu', (e) => {
        e.preventDefault();
        handleRightClick(r, c);
      });
      boardEl.appendChild(cell);
    }
  }
  redrawAll();
}

function redrawAll() {
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      redrawCell(r, c);
    }
  }
}

function redrawCell(r, c) {
  const cell = document.querySelector(`[data-r="${r}"][data-c="${c}"]`);
  if (!cell) return;

  cell.className = 'cell';
  cell.textContent = '';

  const s = state[r] ? state[r][c] : 'hidden';

  if (s === 'flagged') {
    cell.classList.add('flagged');
    cell.textContent = 'F';
  } else if (s === 'opened') {
    cell.classList.add('opened');
    if (board[r] && board[r][c] === 1) {
      cell.classList.add('mine');
      if (r === boomR && c === boomC) {
        cell.classList.add('boom');
      }
      cell.textContent = 'X';
    } else {
      const n = countMines(r, c);
      if (n > 0) {
        cell.textContent = n;
        cell.classList.add('n' + n);
      }
    }
  }
}

function countMines(r, c) {
  if (!board[r]) return 0;
  let cnt = 0;
  for (let dr = -1; dr <= 1; dr++) {
    for (let dc = -1; dc <= 1; dc++) {
      if (dr === 0 && dc === 0) continue;
      const nr = r + dr, nc = c + dc;
      if (nr >= 0 && nr < ROWS && nc >= 0 && nc < COLS) {
        if (board[nr][nc] === 1) cnt++;
      }
    }
  }
  return cnt;
}

function updateInfo() {
  document.getElementById('timeTxt').textContent = '時間：' + elapsedTime.toFixed(1) + ' 秒';
  document.getElementById('levelTxt').textContent = '關卡：' + currentLevel;
  document.getElementById('pauseTxt').textContent = paused ? '⏸ 已暫停' : '';
}

function updateMineCounter() {
  let flagCount = 0;
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      if (state[r] && state[r][c] === 'flagged') flagCount++;
    }
  }
  const remain = Math.max(0, MINES - flagCount);
  document.getElementById('mineTxt').textContent = '剩餘地雷：' + remain;
}

// ==================== 計時器 ====================
let timerId = null;
function startTimer() {
  if (timerId) clearInterval(timerId);
  timerId = setInterval(() => {
    if (gameOver || winFlag || paused) return;
    elapsedTime = (Date.now() - startTime) / 1000;
    document.getElementById('timeTxt').textContent = '時間：' + elapsedTime.toFixed(1) + ' 秒';
  }, 100);
}

function stopTimer() {
  if (timerId) {
    clearInterval(timerId);
    timerId = null;
  }
}

// ==================== 遊戲邏輯 ====================
function handleLeftClick(r, c) {
  if (gameOver || winFlag || paused) return;
  if (state[r][c] === 'flagged') return;
  if (state[r][c] === 'opened') return;

  if (firstClick) {
    firstClick = false;
    startTime = Date.now() - Math.round(elapsedTime * 1000);
    startTimer();
    board = generateBoard(r, c);
  }

  if (board[r][c] === 1) {
    boomR = r;
    boomC = c;
    state[r][c] = 'opened';
    redrawCell(r, c);
    revealAllMines();
    gameOver = true;
    stopTimer();
    setTimeout(handleGameOver, 300);
    return;
  }

  openCell(r, c);
  checkWin();
  saveGame();
  updateMineCounter();
}

function handleRightClick(r, c) {
  if (gameOver || winFlag || paused) return;
  if (state[r][c] === 'opened') return;

  if (state[r][c] === 'hidden') {
    state[r][c] = 'flagged';
  } else if (state[r][c] === 'flagged') {
    state[r][c] = 'hidden';
  }

  redrawCell(r, c);
  saveGame();
  updateMineCounter();
}

function openCell(r, c) {
  if (r < 0 || r >= ROWS || c < 0 || c >= COLS) return;
  if (state[r][c] !== 'hidden') return;

  state[r][c] = 'opened';
  redrawCell(r, c);

  const n = countMines(r, c);
  if (n === 0) {
    for (let dr = -1; dr <= 1; dr++) {
      for (let dc = -1; dc <= 1; dc++) {
        if (dr === 0 && dc === 0) continue;
        openCell(r + dr, c + dc);
      }
    }
  }
}

function revealAllMines() {
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      if (board[r][c] === 1 && state[r][c] !== 'flagged') {
        state[r][c] = 'opened';
        redrawCell(r, c);
      }
    }
  }
}

function checkWin() {
  let opened = 0;
  const total = ROWS * COLS;
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      if (state[r][c] === 'opened') opened++;
    }
  }

  if (opened === total - MINES) {
    winFlag = true;
    stopTimer();
    elapsedTime = (Date.now() - startTime) / 1000;

    const playerName = document.getElementById('playerName').value || '玩家';
    tryAddFastestScore(elapsedTime, playerName);
    updateBestDisplay();

    const completedLevel = currentLevel;
    const completedTime = elapsedTime;

    // ★ 立刻進入下一關（重置狀態），避免「關閉後回到過關前」
    currentLevel++;
    MINES = Math.min(MINES + 1, ROWS * COLS - 9);

    board = [];
    state = [];
    for (let r = 0; r < ROWS; r++) {
      state[r] = [];
      for (let c = 0; c < COLS; c++) {
        state[r][c] = 'hidden';
      }
    }

    firstClick = true;
    gameOver = false;
    winFlag = false;
    paused = false;
    startTime = 0;
    elapsedTime = 0;
    boomR = -1;
    boomC = -1;

    // ★ 立刻存檔（記錄「已進入第 N+1 關，尚未開始」）
    saveGame();

    // 顯示過關訊息
    document.getElementById('statusTxt').textContent =
      '🎉 第 ' + completedLevel + ' 關完成！用時 ' + completedTime.toFixed(1) + ' 秒，進入第 ' + currentLevel + ' 關...';

    // 800ms 後更新畫面
    setTimeout(() => {
      document.getElementById('statusTxt').textContent = '第 ' + currentLevel + ' 關（' + MINES + ' 顆雷）';
      document.getElementById('timeTxt').textContent = '時間：0.0 秒';
      document.getElementById('levelTxt').textContent = '關卡：' + currentLevel;
      document.getElementById('pauseTxt').textContent = '';
      document.getElementById('pauseBtn').textContent = '暫停';
      redrawAll();
      updateMineCounter();
    }, 800);
  }
}

function handleGameOver() {
  const playerName = document.getElementById('playerName').value || '玩家';
  const completed = currentLevel - 1;

  if (completed > 0) {
    tryAddMaxLevel(completed, playerName);
  }
  updateBestDisplay();

  alert('💥 遊戲結束！\n\n玩家：' + playerName + '\n本輪完成：' + completed + ' 關\n\n按確定直接開始新的一輪。');

  currentLevel = 1;
  deleteSave();
  newGame();
}

// ==================== 按鈕功能 ====================
function newGame() {
  stopTimer();

  currentLevel = 1;
  MINES = 10;
  paused = false;

  board = [];
  state = [];
  for (let r = 0; r < ROWS; r++) {
    state[r] = [];
    for (let c = 0; c < COLS; c++) {
      state[r][c] = 'hidden';
    }
  }

  firstClick = true;
  gameOver = false;
  winFlag = false;
  startTime = 0;
  elapsedTime = 0;
  boomR = -1;
  boomC = -1;

  document.getElementById('pauseTxt').textContent = '';
  document.getElementById('pauseBtn').textContent = '暫停';
  document.getElementById('statusTxt').textContent = '第 1 關（10 顆雷）';
  document.getElementById('timeTxt').textContent = '時間：0.0 秒';
  document.getElementById('levelTxt').textContent = '關卡：1';

  redrawAll();
  updateMineCounter();
  saveGame();
}

function togglePause() {
  if (gameOver || winFlag) return;

  if (paused) {
    paused = false;
    startTime = Date.now() - Math.round(elapsedTime * 1000);
    startTimer();
    document.getElementById('pauseTxt').textContent = '';
    document.getElementById('pauseBtn').textContent = '暫停';
  } else {
    paused = true;
    stopTimer();
    elapsedTime = (Date.now() - startTime) / 1000;
    document.getElementById('pauseTxt').textContent = '⏸ 已暫停';
    document.getElementById('pauseBtn').textContent = '繼續';
  }
}

function replayLevel() {
  if (currentLevel === 1 && board.length === 0) return;
  if (!confirm('確定要重玩第 ' + currentLevel + ' 關嗎？')) return;

  paused = false;
  stopTimer();

  board = [];
  state = [];
  for (let r = 0; r < ROWS; r++) {
    state[r] = [];
    for (let c = 0; c < COLS; c++) {
      state[r][c] = 'hidden';
    }
  }

  firstClick = true;
  gameOver = false;
  winFlag = false;
  startTime = 0;
  elapsedTime = 0;
  boomR = -1;
  boomC = -1;

  document.getElementById('pauseTxt').textContent = '';
  document.getElementById('pauseBtn').textContent = '暫停';
  document.getElementById('statusTxt').textContent = '第 ' + currentLevel + ' 關（' + MINES + ' 顆雷）- 重玩';
  document.getElementById('timeTxt').textContent = '時間：0.0 秒';
  document.getElementById('levelTxt').textContent = '關卡：' + currentLevel;

  redrawAll();
  updateMineCounter();
  saveGame();
}

function giveUp() {
  if (!confirm('確定要放棄本輪進度，回到第 1 關嗎？')) return;
  deleteSave();
  newGame();
}
